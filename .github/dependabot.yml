# Dependency monitoring.
#
# Grouped and weekly rather than per-package and daily: a pull request per
# patch bump trains everyone to merge without reading, which is worse than a
# slightly older dependency. Major versions are deliberately left ungrouped so
# they arrive on their own and get reviewed on their own.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors still open a PR; they are simply not swept into the group above.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    labels: [dependencies]

  # CI pins actions to commit SHAs, so this is what keeps them current: without
  # it, pinning silently becomes "frozen on an old, possibly vulnerable build".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      # The CodeQL actions MUST move together, and this group is the only thing
      # that guarantees it. `init` writes a config file stamped with its own
      # version and `analyze` refuses to read one that does not match, so a PR
      # that moves one and not the other fails every run — which is exactly what
      # happened twice, on 2026-09-28, from two separate ungrouped PRs.
      #
      # A comment in codeql.yml says the two must match. A comment cannot
      # enforce it; a group can, because Dependabot then has no way to split
      # them.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
      # Everything else, so a routine patch bump is one PR rather than ten.
      # Listed second because a dependency joins the first group whose pattern
      # matches it.
      actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'github/codeql-action*'
