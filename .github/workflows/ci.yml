name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job below needs more.
permissions:
  contents: read

# A superseded push should not keep burning runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 24 matches local development and the Vercel projects. Testing on an
  # older runtime than production runs on proves less than it appears to.
  NODE_VERSION: '24'

jobs:
  # Static gates and the suites that need no database or browser.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The secret scan walks the whole history looking for a leaked
          # credential, so a shallow clone would quietly check almost nothing.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        env:
          VITE_API_URL: http://127.0.0.1:4000
        run: pnpm build
      - name: Unit tests
        run: pnpm test:unit
      - name: Secret scan
        # Runs in pattern-only mode here: the owner's credential reference is
        # deliberately not available to CI. Every pattern check still runs, and
        # the output states which mode it used.
        run: pnpm secrets:check
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  # The browser suites, against the built unified PWA.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_API_URL: http://127.0.0.1:4000
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Migrations and the database suites, against a disposable PostgreSQL that
  # matches production's major version. Production Neon is never reachable from
  # CI: no production credential is available to this workflow.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: leroutier
          POSTGRES_PASSWORD: leroutier_local_dev
          POSTGRES_DB: leroutier_dev
        # Port 55432 so the committed docker/postgres.env works unchanged, and
        # CI exercises exactly the configuration a developer runs locally.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U leroutier -d leroutier_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate a brand-new database
        # The case an incrementally-migrated database can never exercise.
        run: pnpm test:migrate:fresh
      - name: Database tests
        run: pnpm test:database:local
      # API security and assistant tests migrate disposable schemas and need
      # this job's PostgreSQL service just like the database suites.
      - name: API tests
        run: pnpm test:api
      - name: Load, query profiling and disposable restore drill
        run: pnpm test:operations
      - name: Build
        env:
          VITE_API_URL: http://127.0.0.1:4000
        run: pnpm build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Live journeys (real API, real PostgreSQL, real browser)
        run: pnpm test:live:local

  # Each app must still build the way Vercel builds it, from its own root.
  app-root-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Run the Vercel install command from the app directory
        working-directory: apps/${{ matrix.app }}
        run: node -e "require('node:child_process').execSync(require('./vercel.json').installCommand, {stdio:'inherit'})"
      - name: Run the Vercel build command from the app directory
        working-directory: apps/${{ matrix.app }}
        run: node -e "require('node:child_process').execSync(require('./vercel.json').buildCommand, {stdio:'inherit'})"
