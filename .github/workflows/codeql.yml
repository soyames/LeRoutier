name: CodeQL

# Static analysis for the server, domain and browser code. This complements the
# repository's own secret scan: that one asks "did a known credential leak?",
# this one asks "is there an exploitable pattern in the code?".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories land after code is merged, so the codebase is re-analysed on a
    # schedule even when nobody has pushed.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish results to the Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: javascript-typescript
          # security-extended adds the lower-severity rules that catch the
          # authorization and injection patterns worth knowing about here.
          queries: security-extended
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: /language:javascript-typescript
