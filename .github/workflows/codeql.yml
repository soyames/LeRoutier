name: CodeQL

# Static analysis for the server, domain and browser code. This complements the
# repository's own secret scan: that one asks "did a known credential leak?",
# this one asks "is there an exploitable pattern in the code?".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories land after code is merged, so the codebase is re-analysed on a
    # schedule even when nobody has pushed.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish results to the Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          # security-extended adds the lower-severity rules that catch the
          # authorization and injection patterns worth knowing about here.
          queries: security-extended
      # Must match init's version exactly. init writes a config file stamped
      # with its own version and analyze refuses to read a newer one, so a
      # dependency bump that moves one and not the other fails every run.
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:javascript-typescript
