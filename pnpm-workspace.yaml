packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

sharedWorkspaceLockfile: true
strictPeerDependencies: true
onlyBuiltDependencies:
  - esbuild

# Keep the runtime and build toolchain identical across applications.
catalog:
  react: ^19.1.1
  react-dom: ^19.1.1
  lucide-react: ^0.468.0
  react-router: ^7.9.0
  vite: ^6.4.3
  '@vitejs/plugin-react': ^4.3.4
